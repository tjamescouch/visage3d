<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>visage3d — viewer harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d1a; color: #c0c0d0; font-family: monospace; }
    #viewer-container {
      width: 100vw;
      height: 100vh;
    }
    #controls {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      background: rgba(13, 13, 26, 0.9);
      padding: 1rem;
      border: 1px solid #303050;
      border-radius: 4px;
      font-size: 0.85rem;
      max-height: 90vh;
      overflow-y: auto;
      min-width: 240px;
    }
    #controls h3 { color: #7070ff; margin-bottom: 0.5rem; }
    #controls h4 { color: #5060a0; margin-top: 0.75rem; margin-bottom: 0.25rem; font-size: 0.8rem; }
    #status { color: #50a050; margin-bottom: 0.5rem; }
    #animation-list { margin-top: 0.5rem; }
    #animation-list button, #morph-reset {
      display: block;
      margin: 0.25rem 0;
      background: #1a1a3a;
      color: #c0c0d0;
      border: 1px solid #404060;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
    }
    #animation-list button:hover, #morph-reset:hover { border-color: #7070ff; color: #ffffff; }
    .morph-slider {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0.2rem 0;
      font-size: 0.75rem;
    }
    .morph-slider label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .morph-slider input[type="range"] {
      width: 80px;
      accent-color: #7070ff;
    }
    .morph-slider .val {
      width: 2.5em;
      text-align: right;
      color: #7070a0;
    }
    #attribution {
      position: fixed;
      bottom: 0.5rem;
      right: 0.5rem;
      font-size: 0.7rem;
      color: #606080;
      z-index: 10;
    }
    #attribution a { color: #5070a0; }
  </style>
</head>
<body>
  <div id="viewer-container"></div>
  <div id="controls">
    <h3>viewer harness</h3>
    <div id="status">loading...</div>
    <div id="animation-list"></div>
    <div id="morph-controls"></div>
  </div>
  <div id="attribution"></div>
  <script type="module">
    import { VisageViewer } from "../src/viewer/VisageViewer.js";
    import { AssetManager, ASSET_REGISTRY } from "../src/assets/AssetManager.js";

    const container = document.getElementById("viewer-container");
    const status = document.getElementById("status");
    const animList = document.getElementById("animation-list");
    const morphControls = document.getElementById("morph-controls");
    const attribution = document.getElementById("attribution");

    const assets = new AssetManager();

    async function init() {
      try {
        status.textContent = "fetching asset...";

        const url = await assets.getAssetUrl("ellie");
        const entry = assets.getAttribution("ellie");

        if (entry) {
          attribution.innerHTML =
            `${entry.attribution} — <a href="${entry.licenseUrl}" target="_blank">${entry.license}</a>`;
        }

        status.textContent = "loading model...";

        const viewer = new VisageViewer({
          container,
          modelUrl: url,
          backgroundColor: 0x0d0d1a,
        });

        await viewer.load();

        // Animations
        const names = viewer.getAnimationNames();
        const morphNames = viewer.getMorphTargetNames();
        const parts = [];
        if (names.length) parts.push(`${names.length} anim`);
        if (morphNames.length) parts.push(`${morphNames.length} morphs`);
        status.textContent = viewer.loaded
          ? `loaded — ${parts.join(", ") || "no animations or morphs"}`
          : "fallback (model failed to load)";

        names.forEach((name, i) => {
          const btn = document.createElement("button");
          btn.textContent = name || `animation ${i}`;
          btn.onclick = () => viewer.playAnimation(i);
          animList.appendChild(btn);
        });

        // Morph target sliders
        if (morphNames.length > 0) {
          const h4 = document.createElement("h4");
          h4.textContent = `morph targets (${morphNames.length})`;
          morphControls.appendChild(h4);

          const resetBtn = document.createElement("button");
          resetBtn.id = "morph-reset";
          resetBtn.textContent = "reset all";
          resetBtn.onclick = () => {
            viewer.resetMorphTargets();
            document.querySelectorAll(".morph-range").forEach((el) => {
              el.value = "0";
              el.nextElementSibling.textContent = "0.00";
            });
          };
          morphControls.appendChild(resetBtn);

          for (const name of morphNames) {
            const row = document.createElement("div");
            row.className = "morph-slider";

            const label = document.createElement("label");
            label.textContent = name;
            label.title = name;

            const range = document.createElement("input");
            range.type = "range";
            range.className = "morph-range";
            range.min = "0";
            range.max = "1";
            range.step = "0.01";
            range.value = "0";

            const val = document.createElement("span");
            val.className = "val";
            val.textContent = "0.00";

            range.oninput = () => {
              const v = parseFloat(range.value);
              val.textContent = v.toFixed(2);
              viewer.setMorphTargets({ [name]: v });
            };

            row.appendChild(label);
            row.appendChild(range);
            row.appendChild(val);
            morphControls.appendChild(row);
          }
        }
      } catch (err) {
        status.textContent = `error: ${err.message}`;
        status.style.color = "#ff5050";
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
